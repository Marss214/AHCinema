name: CI/CD Backend to Tenten

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code mới nhất từ GitHub
        uses: actions/checkout@v4

      - name: 2. Đóng gói Zip (Loại bỏ vendor) & Tạo tool giải nén
        run: |
          mkdir deploy_dist
          cd backend
          zip -q -r ../deploy_dist/deploy.zip . -x "*.git*" "node_modules/*" "vendor/*"
          cd ..
          echo "<?php ini_set('display_errors', 1); error_reporting(E_ALL); \$z = new ZipArchive; if(\$z->open('deploy.zip') === TRUE) { if(\$z->extractTo('./')) { \$z->close(); unlink('deploy.zip'); unlink('unzip.php'); echo 'Thanh cong'; } else { echo 'Loi giai nen'; } } else { echo 'Khong the mo file zip'; } ?>" > deploy_dist/unzip.php

      - name: 3. Bắn 2 file lên cPanel qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_dist/
          server-dir: /public_html/

      - name: 4. Kích hoạt giải nén từ xa trên Host
        run: php -r "echo file_get_contents('https://ahcinema.click/unzip.php');"