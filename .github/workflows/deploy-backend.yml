name: CI/CD Backend to Tenten

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Lấy code mới nhất từ GitHub
        uses: actions/checkout@v4

     - name: 2. Đóng gói Zip & Tạo tool giải nén
        run: |
          mkdir deploy_dist
          mkdir deploy_dist/public
          cd backend
          zip -q -r ../deploy_dist/deploy.zip . -x "*.git*" "node_modules/*" "vendor/*"
          cd ..
          echo "<?php ini_set('display_errors', 1); error_reporting(E_ALL); \$z = new ZipArchive; \$zipPath = __DIR__ . '/../deploy.zip'; \$extractPath = __DIR__ . '/../'; if(\$z->open(\$zipPath) === TRUE) { if(\$z->extractTo(\$extractPath)) { \$z->close(); unlink(\$zipPath); unlink(__FILE__); echo 'Thanh cong'; } else { echo 'Loi giai nen'; } } else { echo 'Khong mo duoc file zip'; } ?>" > deploy_dist/public/update_core.php

      - name: 3. Bắn 2 file lên cPanel qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_dist/
          server-dir: /public_html/

      - name: 4. Kích hoạt giải nén từ xa trên Host
        run: curl -s "https://ahcinema.click/update_core.php?v=$RANDOM"