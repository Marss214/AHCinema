name: CI/CD Backend to Tenten

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code mới nhất từ GitHub
        uses: actions/checkout@v4

      - name: 2. Đóng gói Zip (Loại bỏ vendor) & Tạo tool giải nén
        run: |
          mkdir deploy_dist
          cd backend # Chui vào thư mục backend trước
          # Nén toàn bộ file trong backend, đẩy ra thư mục deploy_dist ở ngoài
          zip -q -r ../deploy_dist/deploy.zip . -x "*.git*" "node_modules/*" "vendor/*"
          cd ..
          # Tạo file giải nén
          echo "<?php \$z = new ZipArchive; if(\$z->open('deploy.zip') === TRUE) { \$z->extractTo('./'); \$z->close(); unlink('deploy.zip'); unlink('unzip.php'); echo 'Thanh cong'; } else { echo 'Loi'; } ?>" > deploy_dist/unzip.php

      - name: 3. Bắn 2 file lên cPanel qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_dist/
          server-dir: /public_html/

      - name: 4. Kích hoạt giải nén từ xa trên Host
        run: curl -s https://ahcinema.click/unzip.php